<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dimanche 13 Septembre</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap');

  :root{
    --cream: #f7ecdf;
    --cream-2: #f2e2cb;
    --pink: #f8e2d9;
    --pink-soft: #fbeee7;
    --panel: #fffaf6;
    --terracotta: #bf5738;
    --terracotta-dark: #98402a;
    --terracotta-soft: #e3ab8d;
    --ink: #5c3a2e;
    --ink-dim: #9a7d6d;
    --ring: rgba(191,87,56,0.45);
  }

  *{ box-sizing: border-box; }
  html{ background: var(--cream); }
  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 12% 0%, var(--pink) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 100%, var(--cream-2) 0%, transparent 60%),
      linear-gradient(165deg, var(--pink) 0%, var(--cream) 45%, var(--cream-2) 100%);
    color: var(--ink);
    font-family: 'Jost', ui-sans-serif, system-ui, sans-serif;
    overflow-x: hidden;
    position: relative;
  }

  #sky{ position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  .vignette{
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.55), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(191,87,56,0.07), transparent 62%);
  }

  main{
    position: relative; z-index: 2; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px; padding-block: 56px;
  }

  .panel{
    position: relative;
    width: min(560px, 100%);
    background: linear-gradient(180deg, var(--panel), var(--pink-soft));
    border: 1px solid rgba(191,87,56,0.25);
    border-radius: 14px;
    box-shadow: 0 34px 70px -26px rgba(120,58,40,0.28), 0 2px 10px rgba(120,58,40,0.06);
    padding: clamp(34px, 7vw, 58px) clamp(24px, 7vw, 50px);
    text-align: center;
  }
  .panel::before{
    content: "";
    position: absolute; inset: 10px;
    border: 1px solid rgba(191,87,56,0.16);
    border-radius: 9px;
    pointer-events: none;
  }

  .eyebrow{
    font-family: 'Marcellus', serif;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--terracotta-dark);
    font-weight: 400;
    margin: 0 0 18px;
  }

  .ornament{
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 16px 0 26px;
  }
  .ornament::before, .ornament::after{
    content: ""; height: 1px; width: 42px;
    background: linear-gradient(90deg, transparent, rgba(191,87,56,0.4));
  }
  .ornament::after{ background: linear-gradient(90deg, rgba(191,87,56,0.4), transparent); }
  .ornament svg{ width: 20px; height: 20px; }

  .headline{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(2rem, 6.4vw, 3.1rem);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
    color: var(--terracotta-dark);
  }

  .sub{
    font-weight: 300;
    font-size: 15.5px;
    color: var(--ink-dim);
    margin: 16px 0 0;
    line-height: 1.6;
    max-width: 40ch;
    margin-inline: auto;
    letter-spacing: 0.01em;
  }

  .step{ display: none; }
  .step.active{ display: block; animation: rise .55s ease both; }
  @keyframes rise{ from{ opacity:0; transform: translateY(12px);} to{ opacity:1; transform: translateY(0);} }

  button{ font-family: inherit; cursor: pointer; }

  /* ---- soft pill buttons ---- */
  .btn{
    appearance: none;
    background: transparent;
    border: 1px solid var(--terracotta);
    color: var(--terracotta-dark);
    border-radius: 999px;
    padding: 15px 40px;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: background .22s ease, color .22s ease, transform .18s ease, box-shadow .22s ease;
  }
  .btn:focus-visible{ outline: 2px solid var(--ring); outline-offset: 3px; }
  .btn-yes:hover{ background: var(--terracotta); color: var(--panel); box-shadow: 0 10px 26px -10px rgba(191,87,56,0.45); }
  .btn-yes:active{ transform: scale(0.98); }

  .yn-row{
    display: flex; gap: 20px; justify-content: center; align-items: center;
    flex-wrap: wrap; margin-top: 34px; min-height: 58px;
  }
  .no-placeholder{ width: 126px; height: 52px; flex: 0 0 auto; }

  .btn-no{
    position: fixed; left: 0; top: 0; z-index: 40;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(191,87,56,0.28);
    color: var(--ink-dim);
    transition: transform .28s cubic-bezier(.2,.9,.3,1.3), left .28s cubic-bezier(.2,.9,.3,1.3), top .28s cubic-bezier(.2,.9,.3,1.3);
  }

  .hint{
    margin-top: 26px; font-size: 13px; font-style: italic; font-weight: 300;
    color: var(--ink-dim); min-height: 18px; font-family: 'Cormorant Garamond', serif; letter-spacing: 0.01em;
  }

  /* ---- choice grids ---- */
  .choice-grid{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
    gap: 14px; margin-top: 36px;
  }
  .choice-grid.slots{ grid-template-columns: repeat(2, 1fr); max-width: 340px; margin-inline: auto; }

  .choice{
    background: rgba(191,87,56,0.04);
    border: 1px solid rgba(191,87,56,0.2);
    border-radius: 10px;
    padding: 24px 12px 18px;
    color: var(--ink);
    text-align: center;
    transition: transform .16s ease, border-color .16s ease, background .16s ease;
  }
  .choice svg{ width: 27px; height: 27px; color: var(--terracotta); margin-bottom: 12px; }
  .choice .label{
    font-family: 'Jost', sans-serif; font-weight: 500; font-size: 12.5px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim);
  }
  .choice:hover{ transform: translateY(-3px); border-color: var(--terracotta); background: rgba(191,87,56,0.09); }
  .choice:hover .label{ color: var(--terracotta-dark); }
  .choice:focus-visible{ outline: 2px solid var(--ring); outline-offset: 2px; }

  /* ---- step 4 ---- */
  .heart-icon{ color: var(--terracotta); margin-bottom: 6px; }
  .heart-icon svg{ width: 30px; height: 30px; }

  .recap{
    margin: 28px auto 0; max-width: 360px;
    background: rgba(191,87,56,0.05);
    border: 1px solid rgba(191,87,56,0.18);
    border-radius: 10px;
    padding: 18px 24px;
    text-align: left;
    font-family: 'Jost', sans-serif;
    font-size: 14px; font-weight: 300;
    color: var(--ink-dim);
    line-height: 2;
  }
  .recap b{ color: var(--terracotta-dark); font-weight: 500; }

  .btn-cal{
    display: inline-block; margin-top: 30px;
    background: transparent; border: 1px solid var(--terracotta);
    color: var(--terracotta-dark); text-decoration: none;
    border-radius: 999px; padding: 15px 34px;
    font-family: 'Jost', sans-serif; font-weight: 500; font-size: 12.5px;
    letter-spacing: 0.18em; text-transform: uppercase;
    transition: background .2s ease, color .2s ease, transform .18s ease;
  }
  .btn-cal:hover{ background: var(--terracotta); color: var(--panel); transform: translateY(-2px); }

  .manual{ margin-top: 18px; font-size: 12.5px; font-weight: 300; color: var(--ink-dim); font-style: italic; font-family: 'Cormorant Garamond', serif; }

  /* ---- step markers ---- */
  .dots{ display: flex; gap: 10px; justify-content: center; margin-top: 34px; }
  .dots span{ width: 6px; height: 6px; border-radius: 50%; background: rgba(191,87,56,0.2); transition: background .25s ease; }
  .dots span.done{ background: var(--terracotta-soft); }
  .dots span.now{ background: var(--terracotta); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  @media (max-width: 420px){
    .panel{ border-radius: 10px; }
    .btn{ padding: 14px 30px; font-size: 12px; letter-spacing: 0.14em; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="vignette"></div>

<main>
  <div class="panel">

    <!-- STEP 1 -->
    <section class="step active" data-step="1">
      <p class="eyebrow">Une invitation</p>
      <h1 class="headline">Tu veux être mon date<br>ce dimanche 13&nbsp;septembre&nbsp;?</h1>
      <div class="ornament">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="7" r="4" fill="var(--terracotta-soft)" opacity="0.85"/>
          <circle cx="17" cy="12" r="4" fill="var(--terracotta-soft)" opacity="0.85"/>
          <circle cx="12" cy="17" r="4" fill="var(--terracotta-soft)" opacity="0.85"/>
          <circle cx="7" cy="12" r="4" fill="var(--terracotta-soft)" opacity="0.85"/>
          <circle cx="12" cy="12" r="3" fill="var(--terracotta)"/>
        </svg>
      </div>
      <p class="sub">Prends ton temps. Enfin — pas trop.</p>
      <div class="yn-row" id="ynRow">
        <button class="btn btn-yes" id="yesBtn">Oui</button>
        <span class="no-placeholder"></span>
      </div>
      <p class="hint" id="hint">&nbsp;</p>
    </section>

    <!-- STEP 2 -->
    <section class="step" data-step="2">
      <p class="eyebrow">Elle a dit oui</p>
      <h1 class="headline">Déjeuner ou dîner&nbsp;?</h1>
      <div class="choice-grid slots">
        <button class="choice" data-slot="Déjeuner" data-time="lunch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.2"/>
            <line x1="12" y1="1.6" x2="12" y2="4.3"/><line x1="12" y1="19.7" x2="12" y2="22.4"/>
            <line x1="1.6" y1="12" x2="4.3" y2="12"/><line x1="19.7" y1="12" x2="22.4" y2="12"/>
            <line x1="4.5" y1="4.5" x2="6.4" y2="6.4"/><line x1="17.6" y1="17.6" x2="19.5" y2="19.5"/>
            <line x1="4.5" y1="19.5" x2="6.4" y2="17.6"/><line x1="17.6" y1="6.4" x2="19.5" y2="4.5"/>
          </svg>
          <span class="label">Déjeuner</span>
        </button>
        <button class="choice" data-slot="Dîner" data-time="dinner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.2A8.4 8.4 0 1 1 9.8 4a7 7 0 0 0 10.2 10.2Z"/>
          </svg>
          <span class="label">Dîner</span>
        </button>
      </div>
    </section>

    <!-- STEP 3 -->
    <section class="step" data-step="3">
      <p class="eyebrow">Presque prêt</p>
      <h1 class="headline">Envie de quoi&nbsp;?</h1>
      <div class="choice-grid">
        <button class="choice" data-food="Traditionnel oranais">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15.6c0 2 3.6 3.4 8 3.4s8-1.4 8-3.4"/>
            <path d="M4.6 15.6h14.8"/>
            <path d="M8.3 15.3C8.7 9.2 10.4 5.3 12 5.3s3.3 3.9 3.7 10"/>
            <line x1="12" y1="2.4" x2="12" y2="4.4"/>
          </svg>
          <span class="label">Traditionnel</span>
        </button>
        <button class="choice" data-food="Asiatique">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13.6c0 3.5 3.6 5.9 8 5.9s8-2.4 8-5.9"/>
            <path d="M4.3 13.6h15.4"/>
            <line x1="9" y1="12" x2="16.3" y2="3.7"/><line x1="11.2" y1="12" x2="18.5" y2="4"/>
          </svg>
          <span class="label">Asiatique</span>
        </button>
        <button class="choice" data-food="Indien">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.7c0 3.3 3.1 5.9 7 5.9s7-2.6 7-5.9"/>
            <path d="M5.3 12.7h13.4"/>
            <path d="M12 3.4c1.7 1.3 1.7 3.2 0 4.5-1.7-1.3-1.7-3.2 0-4.5Z"/>
          </svg>
          <span class="label">Indien</span>
        </button>
        <button class="choice" data-food="Classique">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.3 2.4v6.7a1.7 1.7 0 0 0 3.4 0V2.4M8 9.3v12.3M6.3 2.4v3.4M9.7 2.4v3.4"/>
            <path d="M16.6 2.4c-1.5 0-2.7 1.9-2.7 4.7 0 2.3 1 4.1 2.2 4.6v9.9"/>
          </svg>
          <span class="label">Classique</span>
        </button>
        <button class="choice" data-food="Surprise">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.3 9 12 3.2 19.7 9 12 21Z"/>
            <path d="M4.3 9h15.4M9 9 12 3.2 15 9M9 9l3 12M15 9l-3 12"/>
          </svg>
          <span class="label">Surprise</span>
        </button>
      </div>
    </section>

    <!-- STEP 4 -->
    <section class="step" data-step="4">
      <div class="heart-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">
          <path d="M12 20.1S3.2 14.6 3.2 8.8c0-3 2.3-5.2 5-5.2 1.8 0 3.2 1 3.8 2.4.6-1.4 2-2.4 3.8-2.4 2.7 0 5 2.2 5 5.2 0 5.8-8.8 11.3-8.8 11.3Z"/>
        </svg>
      </div>
      <h1 class="headline">Don't forget that<br>I love you so much.</h1>
      <div class="recap" id="recap"></div>
      <div><a class="btn-cal" id="calBtn" href="#" target="_blank" rel="noopener">Ajouter à mon calendrier</a></div>
      <p class="manual" id="manual"></p>
    </section>

    <div class="dots" id="dots">
      <span class="now" data-i="1"></span><span data-i="2"></span><span data-i="3"></span><span data-i="4"></span>
    </div>
  </div>
</main>

<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- notification email (Web3Forms, free, no backend) ----------------
     1) Va sur https://web3forms.com, entre farouk.alibraham@gmail.com, tu reçois une
        clé d'accès gratuite par email en quelques secondes (aucune inscription requise).
     2) Colle cette clé ci-dessous à la place de "REMPLACE_PAR_TA_CLE_WEB3FORMS".
     3) Publie ensuite le fichier (GitHub Pages, etc.) — tant que la clé n'est pas
        remplacée, cette notification est simplement ignorée (le site continue de
        fonctionner normalement). */
  var WEB3FORMS_KEY = 'REMPLACE_PAR_TA_CLE_WEB3FORMS';

  /* ---------------- ambient sky (soft drifting blush dots) ---------------- */
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var particles = [];
  var TONES = ['191,87,56', '227,171,141', '223,150,120'];

  function resize(){
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var n = Math.round((window.innerWidth * window.innerHeight) / 34000);
    particles = [];
    for (var i = 0; i < n; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 1 + Math.random() * 2.1,
        a: 0.10 + Math.random() * 0.22,
        s: 0.06 + Math.random() * 0.1,
        sway: 0.4 + Math.random() * 0.6,
        c: TONES[Math.floor(Math.random() * TONES.length)]
      });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  function drawSky(t) {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var tw = reduceMotion ? p.a : p.a * (0.6 + 0.4 * Math.sin(t * 0.0007 + i));
      var x = p.x + (reduceMotion ? 0 : Math.sin(t * 0.0005 + i) * p.sway * 6);
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + p.c + ',' + tw.toFixed(3) + ')';
      ctx.arc(x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      if (!reduceMotion) {
        p.y -= p.s;
        if (p.y < -6) { p.y = window.innerHeight + 6; p.x = Math.random() * window.innerWidth; }
      }
    }
    requestAnimationFrame(drawSky);
  }
  requestAnimationFrame(drawSky);

  /* ---------------- blush spark burst ---------------- */
  function sparkBurst() {
    if (reduceMotion) return;
    var n = 10;
    for (var i = 0; i < n; i++) {
      var el = document.createElement('div');
      el.textContent = '✿';
      el.style.position = 'fixed';
      el.style.left = (window.innerWidth / 2 + (Math.random() - 0.5) * 150) + 'px';
      el.style.top = (window.innerHeight / 2 + (Math.random() - 0.5) * 60) + 'px';
      el.style.fontSize = (10 + Math.random() * 10) + 'px';
      el.style.color = '#bf5738';
      el.style.pointerEvents = 'none';
      el.style.zIndex = 60;
      el.style.opacity = '0.9';
      el.style.transition = 'transform 1.1s cubic-bezier(.15,.6,.3,1), opacity 1.1s ease';
      document.body.appendChild(el);
      (function (el) {
        requestAnimationFrame(function () {
          var dx = (Math.random() - 0.5) * 150;
          var dy = -100 - Math.random() * 110;
          el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
          el.style.opacity = '0';
        });
        setTimeout(function () { el.remove(); }, 1200);
      })(el);
    }
  }

  /* ---------------- dodging "No" button ---------------- */
  var yesBtn = document.getElementById('yesBtn');
  var ynRow = document.getElementById('ynRow');
  var hint = document.getElementById('hint');
  var noBtn = document.createElement('button');
  noBtn.className = 'btn btn-no';
  noBtn.textContent = 'Non';
  noBtn.type = 'button';
  document.body.appendChild(noBtn);

  var hints = [
    "Elle est timide, cette réponse.",
    "Presque — pas vraiment.",
    "On dirait qu'elle se dérobe.",
    "Essaie encore ?",
    "Tu es certaine ?",
    "Il ne reste plus qu'une option, non ?"
  ];
  var dodgeCount = 0;

  function placeNoInline() {
    var r = ynRow.getBoundingClientRect();
    var w = noBtn.offsetWidth || 110;
    var h = noBtn.offsetHeight || 52;
    noBtn.style.left = Math.round(r.left + r.width - w) + 'px';
    noBtn.style.top = Math.round(r.top + (r.height - h) / 2) + 'px';
  }

  function dodge() {
    dodgeCount++;
    var w = noBtn.offsetWidth || 110;
    var h = noBtn.offsetHeight || 52;
    var margin = 14;
    var maxX = Math.max(margin, window.innerWidth - w - margin);
    var maxY = Math.max(margin, window.innerHeight - h - margin);
    var x = margin + Math.random() * (maxX - margin);
    var y = margin + Math.random() * (maxY - margin);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    hint.textContent = hints[Math.min(dodgeCount - 1, hints.length - 1)];
  }

  placeNoInline();
  window.addEventListener('resize', placeNoInline);
  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('focus', dodge);
  noBtn.addEventListener('touchstart', function (e) { e.preventDefault(); dodge(); }, { passive: false });
  noBtn.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse') { dodge(); } });
  noBtn.addEventListener('click', function (e) { e.preventDefault(); dodge(); });

  /* ---------------- step flow ---------------- */
  var steps = document.querySelectorAll('.step');
  var dots = document.querySelectorAll('#dots span');
  var state = { slot: null, slotLabel: null, food: null, foodDisplay: null };

  function goTo(n) {
    steps.forEach(function (s) { s.classList.toggle('active', s.dataset.step == n); });
    dots.forEach(function (d) {
      var i = parseInt(d.dataset.i, 10);
      d.classList.toggle('done', i < n);
      d.classList.toggle('now', i === n);
    });
  }

  yesBtn.addEventListener('click', function () {
    noBtn.style.display = 'none';
    sparkBurst();
    goTo(2);
  });

  document.querySelectorAll('[data-slot]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.slot = btn.dataset.time;
      state.slotLabel = btn.dataset.slot;
      goTo(3);
    });
  });

  document.querySelectorAll('[data-food]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var choice = btn.dataset.food;
      if (choice === 'Surprise') {
        var pool = ['Traditionnel oranais', 'Asiatique', 'Indien', 'Classique'];
        choice = pool[Math.floor(Math.random() * pool.length)];
        state.foodDisplay = 'Surprise';
      } else {
        state.foodDisplay = choice;
      }
      state.food = choice;
      finish();
    });
  });

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function finish() {
    var hour = state.slot === 'lunch' ? 12 : 19; // base mealtime advanced by one hour
    var startH = hour, endH = hour + 2;
    var dateStr = '20260913';
    var start = dateStr + 'T' + pad(startH) + '0000';
    var end = dateStr + 'T' + pad(endH) + '0000';

    var title = 'Date avec Yanis';
    var details = "Don't forget that I love you so much\\nCuisine : " + state.foodDisplay;
    var location = 'Oran, Algérie';

    var url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
      + '&text=' + encodeURIComponent(title)
      + '&dates=' + start + '/' + end
      + '&details=' + encodeURIComponent(details)
      + '&location=' + encodeURIComponent(location);

    document.getElementById('calBtn').href = url;

    var timeLabel = pad(startH) + 'h00';
    document.getElementById('recap').innerHTML =
      '<div>Dimanche 13 septembre</div>' +
      '<div>' + state.slotLabel + ' — <b>' + timeLabel + '</b></div>' +
      '<div>' + state.foodDisplay + '</div>';
    document.getElementById('manual').textContent =
      'Dimanche 13/09 à ' + timeLabel + ' — ' + state.foodDisplay + '.';

    notifyByEmail(timeLabel);
    sparkBurst();
    goTo(4);
  }

  function notifyByEmail(timeLabel) {
    if (!WEB3FORMS_KEY || WEB3FORMS_KEY.indexOf('REMPLACE') === 0) return;
    var payload = {
      access_key: WEB3FORMS_KEY,
      subject: "Elle a dit oui — Dimanche 13 septembre 💌",
      from_name: 'Dimanche 13 Septembre',
      'Date': 'Dimanche 13 septembre',
      'Créneau': state.slotLabel + ' — ' + timeLabel,
      'Cuisine': state.foodDisplay,
      'Message': "Don't forget that I love you so much."
    };
    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(function () {});
  }
})();
</script>
</body>
